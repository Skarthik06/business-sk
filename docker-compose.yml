# ===========================================================================
# BUSINESS_SK — UNIVERSAL stack for BOTH projects on one shared database.
# ===========================================================================
#   db                : PostgreSQL 18 + pgvector          (host :5433)
#                        └─ instagram_business  (IG project)
#                        └─ affiliate_rag_bot    (affiliate project, + vector ext)
#   backend           : IG FastAPI carousel generator     (host :8000)
#   frontend          : IG React/Vite dev server (HMR)     (host :3000)
#   affiliate_backend : affiliate JSON content API         (host :8100)
#
#   Start:  docker compose up -d --build
#   Logs :  docker compose logs -f affiliate_backend
#   Stop :  docker compose down            (containers only — DATA IS KEPT)
#
# ---------------------------------------------------------------------------
#  DATA SAFETY — all app data lives in the named volume `business_sk_pgdata`.
#  It survives restarts, rebuilds, container deletion, and `docker compose down`.
#
#  SAFE (data kept):
#    - Docker Desktop: Stop / Start / Restart (project or container); rebuild.
#    - CLI: docker compose down / stop / up / restart.
#  DESTROYS DATA (never do this unless you truly want a wipe):
#    - Docker Desktop → Volumes tab → delete `business_sk_pgdata`.
#    - Docker Desktop → deleting the project WITH "Delete volumes" ticked.
#    - CLI: docker compose down -v   (the -v wipes volumes).
#
#  A one-time backup of the pre-move data is preserved in the old volume
#  `instagram_business_pgdata` — keep it until you're confident, then delete.
# ---------------------------------------------------------------------------
# ===========================================================================
name: business_sk

services:
  db:
    image: pgvector/pgvector:pg18      # Postgres 18 WITH pgvector (affiliate needs it)
    container_name: business_sk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram
      POSTGRES_DB: instagram_business   # IG db; affiliate_rag_bot added by initdb
    ports:
      - "5433:5432"
    volumes:
      # PG18 images store data in a major-version subdir — mount the PARENT.
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro   # creates affiliate_rag_bot + vector ext
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram -d instagram_business"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Instagram project ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./instagram_automation
      dockerfile: Dockerfile.backend
    container_name: business_sk_ig_backend
    restart: unless-stopped
    env_file:
      - ./instagram_automation/.env      # OPENAI_API_KEY, hosting + legacy IG keys
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/app"]
    environment:
      # Shared DB: Supabase (set SUPABASE_DB_URL in the git-ignored root .env). Falls back to
      # the local db container if unset. The phone engagement service uses the SAME Supabase URL.
      DATABASE_URL: ${SUPABASE_DB_URL:-postgresql://instagram:instagram@db:5432/instagram_business}
      LEGACY_SQLITE_DB: /app/legacy/posts.db
      BUSINESS_USE_DOCLING: "1"
    volumes:
      - ./instagram_automation/app:/app/app
      - docling_cache:/root/.cache
      - ./instagram_automation/business:/app/business
      - ./instagram_automation/data-business:/app/data-business
      - ./instagram_automation/images:/app/images
      - ./instagram_automation/config.json:/app/config.json
      - ./instagram_automation/.ragskey:/app/.ragskey
      - ./instagram_automation/posts.db:/app/legacy/posts.db:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: business_sk_ig_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_TARGET: http://backend:8000              # /api + /cdn → IG backend
      VITE_SK_API_TARGET: http://affiliate_backend:8100 # /sk-api → affiliate (Business-SK) API
      # Google OAuth Client ID is PUBLIC (safe in the browser). Restriction is enforced
      # server-side via GOOGLE_ALLOWED_EMAILS. Add your prod domain to the OAuth client later.
      VITE_GOOGLE_CLIENT_ID: 506193542177-72noi6toj3d0vt5pp1h7tgtjtats8smi.apps.googleusercontent.com
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./instagram_automation/frontend:/app
      - ig_frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Affiliate project (API only — its panel lives in the IG frontend) ─────
  affiliate_backend:
    build:
      context: ./affiliate-rag-bot
      dockerfile: Dockerfile
    container_name: business_sk_affiliate_backend
    restart: unless-stopped
    env_file:
      - ./affiliate-rag-bot/.env         # OPENAI_API_KEY, AMAZON_ASSOCIATE_TAG, etc.
    environment:
      # Point at the shared db service; overrides the .env DATABASE_URL.
      DATABASE_URL: postgresql://instagram:instagram@db:5432/affiliate_rag_bot
      HEADLESS: "true"                    # no display inside the container
    # Live source mount so the container always runs CURRENT host code (like the IG
    # backend). Reload picks up edits without a rebuild. The named volume keeps the
    # container's own /app/__pycache__ from leaking onto the host.
    volumes:
      - ./affiliate-rag-bot:/app
      - hf_cache:/root/.cache/huggingface # persist the embedding model across restarts
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  docling_cache:
  ig_frontend_node_modules:
  hf_cache:
